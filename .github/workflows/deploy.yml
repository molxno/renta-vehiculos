name: Deploy

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag renta-vehiculos:ci .
